name: Software checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt ruff
      - name: Check Python correctness
        run: ruff check --select E9,F --ignore F401,F541,F841 overlay config tests
      - name: Check shell syntax
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script" || exit 1
          done < <(git ls-files -z '*.sh')
          bash -n config/wm1303-upgrade
      - name: Run hardware-independent regressions
        run: python -m unittest discover -s tests -v
